<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AIXC compressor architecture preview</title>
  <desc id="desc">A clean left-to-right codec diagram showing text units, predictor, hit/miss decisions, and an AIXC archive.</desc>
  <defs>
    <radialGradient id="bgAtmosphere" cx="22%" cy="16%" r="92%">
      <stop offset="0%" stop-color="#fdfbff"/>
      <stop offset="50%" stop-color="#f0e7fc"/>
      <stop offset="100%" stop-color="#e3d6f7"/>
    </radialGradient>
    <radialGradient id="ambientBloomA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9b1fa" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#c9b1fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientBloomB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a88bf5" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a88bf5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="52%" stop-color="#fcf8ff" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#ede3fb" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="glassInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#f6f0fe" stop-opacity="0.74"/>
    </linearGradient>
    <linearGradient id="nodeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#f6f0fe" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="archiveCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4edff"/>
      <stop offset="100%" stop-color="#e7dafc"/>
    </linearGradient>
    <linearGradient id="accentPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8660d8"/>
      <stop offset="100%" stop-color="#633eb5"/>
    </linearGradient>
    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="128%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#402676" flood-opacity="0.14"/>
    </filter>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#402676" flood-opacity="0.10"/>
    </filter>
    <pattern id="subtleGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6c48b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0 1 10 5 0 9 2.2 5z" fill="#6c48b8"/>
    </marker>
  </defs>

  <!-- Pastel lavender atmosphere + subtle blueprint grid -->
  <rect width="1200" height="720" fill="url(#bgAtmosphere)"/>
  <rect width="1200" height="720" fill="url(#subtleGrid)"/>
  <circle cx="230" cy="140" r="280" fill="url(#ambientBloomA)"/>
  <circle cx="990" cy="590" r="300" fill="url(#ambientBloomB)"/>

  <!-- Outer Liquid Glass shell -->
  <rect x="64" y="72" width="1072" height="576" rx="28" fill="url(#glassOuter)" stroke="#ffffff" stroke-width="2" filter="url(#glassShadow)"/>
  <rect x="65" y="73" width="1070" height="574" rx="27" fill="none" stroke="#8466c4" stroke-opacity="0.20" stroke-width="1"/>

  <!-- Inner frosted stage -->
  <rect x="104" y="112" width="992" height="496" rx="20" fill="url(#glassInner)" stroke="#8466c4" stroke-opacity="0.18" stroke-width="1.2"/>

  <!-- Header -->
  <g text-anchor="middle">
    <rect x="518" y="136" width="164" height="28" rx="14" fill="#6c48b8" fill-opacity="0.11" stroke="#6c48b8" stroke-opacity="0.22" stroke-width="1"/>
    <text x="600" y="154" fill="#6c48b8" font-family="IBM Plex Mono, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="2">CODEC PIPELINE</text>
    <text x="600" y="202" fill="#1b1328" font-family="Google Sans Flex, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="38" font-weight="750" letter-spacing="-0.8">AIXC Predictor Codec</text>
    <text x="600" y="234" fill="#4e4163" font-family="IBM Plex Mono, Consolas, monospace" font-size="16.5">store what the predictor cannot reproduce</text>
  </g>

  <!-- Pipeline connector arrows -->
  <g fill="none" stroke="#6c48b8" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M276 376H346"/>
    <path d="M518 376H588"/>
    <path d="M760 376H828"/>
  </g>

  <!-- Stage Cards -->
  <g filter="url(#cardShadow)">
    <rect x="138" y="324" width="138" height="104" rx="16" fill="url(#nodeCard)" stroke="#8466c4" stroke-opacity="0.26" stroke-width="1.5"/>
    <rect x="352" y="324" width="166" height="104" rx="16" fill="url(#nodeCard)" stroke="#8466c4" stroke-opacity="0.26" stroke-width="1.5"/>
    <rect x="594" y="324" width="166" height="104" rx="16" fill="url(#nodeCard)" stroke="#8466c4" stroke-opacity="0.26" stroke-width="1.5"/>
    <rect x="836" y="284" width="226" height="184" rx="20" fill="url(#archiveCard)" stroke="#6c48b8" stroke-opacity="0.40" stroke-width="1.8"/>
  </g>

  <!-- Subtle top step pills -->
  <g font-family="IBM Plex Mono, Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">
    <rect x="183" y="313" width="48" height="22" rx="11" fill="#ffffff" stroke="#8466c4" stroke-opacity="0.28"/>
    <text x="207" y="328" fill="#6c48b8">01</text>

    <rect x="411" y="313" width="48" height="22" rx="11" fill="#ffffff" stroke="#8466c4" stroke-opacity="0.28"/>
    <text x="435" y="328" fill="#6c48b8">02</text>

    <rect x="653" y="313" width="48" height="22" rx="11" fill="#ffffff" stroke="#8466c4" stroke-opacity="0.28"/>
    <text x="677" y="328" fill="#6c48b8">03</text>

    <rect x="907" y="272" width="84" height="24" rx="12" fill="url(#accentPill)"/>
    <text x="949" y="288" fill="#ffffff" letter-spacing="0.8">ARCHIVE</text>
  </g>

  <!-- Node Labels -->
  <g text-anchor="middle">
    <g fill="#1b1328" font-family="Google Sans Flex, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="700" letter-spacing="-0.2">
      <text x="207" y="372">TEXT</text>
      <text x="435" y="372">PREDICT</text>
      <text x="677" y="372">DECIDE</text>
      <text x="949" y="329" fill="#3b1f78">AIXC FILE</text>
    </g>
    <g fill="#5b4d73" font-family="IBM Plex Mono, Consolas, monospace" font-size="13.5">
      <text x="207" y="399">units</text>
      <text x="435" y="399">next-unit argmax</text>
      <text x="677" y="399">hit or residual</text>
    </g>
    <!-- Archive inner pill rows -->
    <g font-family="IBM Plex Mono, Consolas, monospace" font-size="13.5" font-weight="500">
      <rect x="858" y="346" width="182" height="30" rx="10" fill="#ffffff" fill-opacity="0.86" stroke="#8466c4" stroke-opacity="0.20"/>
      <text x="949" y="366" fill="#4e2e94">seed units</text>

      <rect x="858" y="384" width="182" height="30" rx="10" fill="#ffffff" fill-opacity="0.86" stroke="#8466c4" stroke-opacity="0.20"/>
      <text x="949" y="404" fill="#4e2e94">packed decisions</text>

      <rect x="858" y="422" width="182" height="30" rx="10" fill="#ffffff" fill-opacity="0.86" stroke="#8466c4" stroke-opacity="0.20"/>
      <text x="949" y="442" fill="#4e2e94">miss residuals</text>
    </g>
  </g>

  <!-- Deterministic decode footer capsule -->
  <g text-anchor="middle">
    <rect x="196" y="520" width="808" height="46" rx="23" fill="#ffffff" fill-opacity="0.82" stroke="#8466c4" stroke-opacity="0.24" stroke-width="1.2"/>
    <text x="600" y="548.5" fill="#4e2e94" font-family="IBM Plex Mono, Consolas, monospace" font-size="15.5" font-weight="500">deterministic decode = same predictor + same manifest + same residual stream</text>
  </g>
</svg>
